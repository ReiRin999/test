<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บไซต์ของกาย - ลงชื่อเข้าใช้</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at bottom, #0d1d31 0%, #0c0d13 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* --- พระจันทร์เสี้ยว มุมซ้ายบน --- */
        .moon {
            position: absolute;
            top: 40px;
            left: 50px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: -15px 12px 0 0 #fffae6;
            filter: drop-shadow(0 0 15px rgba(255, 235, 170, 0.9));
            transform: rotate(-10deg);
            z-index: 2;
        }

        /* --- ท้องฟ้า ดาวตก และดาวระยิบระยับทั่วจอ --- */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        /* ดาวพื้นหลังระยิบระยับ */
        .stars-bg {
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 
                50px 100px #fff, 200px 300px #fff, 350px 80px #fff, 500px 250px #fff,
                650px 120px #fff, 800px 400px #fff, 950px 50px #fff, 1100px 300px #fff,
                150px 550px #fff, 400px 650px #fff, 700px 600px #fff, 900px 700px #fff,
                1200px 150px #fff, 1350px 450px #fff, 1500px 200px #fff, 1650px 600px #fff;
            opacity: 0.6;
        }

        /* ดาวตก */
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1),
                        0 0 12px #ffffff;
            animation: animate 3s linear infinite;
        }

        .star::before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, #fff, transparent);
        }

        @keyframes animate {
            0% {
                transform: rotate(315deg) translateX(0);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: rotate(315deg) translateX(-1000px);
                opacity: 0;
            }
        }

        /* กระจายตำแหน่งดาวตก 12 ดวงทั่วหน้าจอ */
        .star:nth-child(1) { top: 0%; right: 0%; animation-delay: 0s; animation-duration: 2.2s; }
        .star:nth-child(2) { top: 10%; right: 20%; animation-delay: 1.5s; animation-duration: 3s; }
        .star:nth-child(3) { top: 0%; right: 40%; animation-delay: 0.8s; animation-duration: 2.5s; }
        .star:nth-child(4) { top: 15%; right: 60%; animation-delay: 2.1s; animation-duration: 2.7s; }
        .star:nth-child(5) { top: 0%; right: 80%; animation-delay: 0.4s; animation-duration: 2.1s; }
        .star:nth-child(6) { top: 25%; right: 10%; animation-delay: 1.1s; animation-duration: 2.9s; }
        .star:nth-child(7) { top: 35%; right: 35%; animation-delay: 2.5s; animation-duration: 2.3s; }
        .star:nth-child(8) { top: 30%; right: 70%; animation-delay: 0.2s; animation-duration: 3.2s; }
        .star:nth-child(9) { top: 45%; right: 15%; animation-delay: 1.8s; animation-duration: 2.6s; }
        .star:nth-child(10) { top: 50%; right: 50%; animation-delay: 0.9s; animation-duration: 2.4s; }
        .star:nth-child(11) { top: 55%; right: 85%; animation-delay: 2.3s; animation-duration: 2.8s; }
        .star:nth-child(12) { top: 10%; right: 95%; animation-delay: 1.4s; animation-duration: 2.0s; }

        /* --- ฟอร์มลงชื่อเข้าใช้ --- */
        .center {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
            width: 380px;
            max-width: 90%;
            border-radius: 20px;
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(8px);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 30px;
            color: #ffffff;
            text-shadow: 0 0 12px #ffd700;
        }

        p {
            font-size: 15px;
            color: #d0d0d0;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            background: rgba(0, 0, 0, 0.9);
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ffd700;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px #ffd700;
            background: #ffe44d;
        }
    </style>
</head>
<body>

    <div class="moon"></div>

    <div class="sky">
        <div class="stars-bg"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <div class="center">
        <h1>✨ ยินดีต้อนรับ ✨</h1>
        <p>ลงชื่อเข้าใช้เพื่อเข้าสู่เว็บไซต์ของกาย</p>

        <form onsubmit="event.preventDefault(); alert('ลงชื่อเข้าใช้สำเร็จ!');">
            <div class="input-group">
                <label for="username">ชื่อผู้ใช้ / อีเมล</label>
                <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้..." required>
            </div>

            <div class="input-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน..." required>
            </div>

            <button type="submit">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>

</body>
</html>
