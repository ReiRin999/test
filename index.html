<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บไซต์ของกาย - ลงชื่อเข้าใช้</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050508;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* --- พระจันทร์เสี้ยว มุมซ้ายบน --- */
        .moon {
            position: absolute;
            top: 50px;
            left: 60px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            box-shadow: -18px 10px 0 0 #fffae6;
            filter: drop-shadow(0 0 20px rgba(255, 235, 170, 0.8));
            transform: rotate(-15deg);
            z-index: 2;
        }

        /* --- เอฟเฟกต์ดาวตก (Shooting Stars) --- */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1), 
                        0 0 0 8px rgba(255, 255, 255, 0.1), 
                        0 0 20px rgba(255, 255, 255, 1);
            animation: animate 3s linear infinite;
        }

        .star::before {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 1px;
            background: linear-gradient(90deg, #fff, transparent);
        }

        @keyframes animate {
            0% {
                transform: rotate(315deg) translateX(0);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: rotate(315deg) translateX(-1000px);
                opacity: 0;
            }
        }

        /* กำหนดตำแหน่ง และเวลาเกิดของดาวตกแต่ละดวง */
        .star:nth-child(1) { top: 0px; right: 0px; animation-delay: 0s; animation-duration: 2.5s; }
        .star:nth-child(2) { top: 0px; right: 300px; animation-delay: 1.2s; animation-duration: 3s; }
        .star:nth-child(3) { top: 80px; right: 100px; animation-delay: 2.4s; animation-duration: 2s; }
        .star:nth-child(4) { top: 0px; right: 700px; animation-delay: 0.8s; animation-duration: 2.8s; }
        .star:nth-child(5) { top: 200px; right: 400px; animation-delay: 1.8s; animation-duration: 2.2s; }
