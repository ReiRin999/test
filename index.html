<!DOCTYPE html>

<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เว็บไซต์ของกาย</title>


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        width: 100%;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(
            135deg,
            #8a5a00,
            #d4af37,
            #ffd700,
            #b8860b
        );

        font-family: Arial, sans-serif;
    }

    .center {
        text-align: center;

        padding: 50px;
        border-radius: 25px;

        background: rgba(0, 0, 0, 0.35);

        box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
        margin: 0 0 15px;

        font-size: 50px;
        color: white;

        text-shadow: 0 0 15px #ffd700;
    }

    p {
        font-size: 20px;
        color: white;
    }

    button {
        margin-top: 20px;

        padding: 15px 35px;

        border: none;
        border-radius: 30px;

        background: #ffd700;
        color: #5c4000;

        font-size: 18px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.1);
        box-shadow: 0 0 25px #ffd700;
    }
</style>


</head>

<body>


<div class="center">

    <h1>✨ ยินดีต้อนรับ ✨</h1>

    <p>เข้าสู่เว็บไซต์ของกาย</p>

    <button onclick="alert('สวัสดีคับ! 👋')">
        กดที่นี่
    </button>

</div>


</body>
</html>
